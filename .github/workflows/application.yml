name: App

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".nvmrc"
      - "deploy/**"
      - ".github/workflows/application.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".nvmrc"
      - "deploy/**"
      - ".github/workflows/application.yml"

concurrency:
  group: shipyard-application-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test

  publish-image:
    name: Build and publish image
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        run: |
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{vars.AWS_REGION}}.amazonaws.com"

          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" |
              docker login --username AWS --password-stdin "$REGISTRY"

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/shipyard:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/shipyard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      ecr-registry: ${{ steps.ecr-login.outputs.registry }}

  deploy-app:
    name: Deploy Application
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Encode deployment files
        id: deployment-files
        run: |
          echo "compose=$(base64 --wrap=0 deploy/compose.yaml)" >> "$GITHUB_OUTPUT"
          echo "script=$(base64 --wrap=0 deploy/deploy.sh)" >> "$GITHUB_OUTPUT"

      - name: Send deployment command
        id: send-command
        env:
          COMPOSE_BASE64: ${{ steps.deployment-files.outputs.compose }}
          SCRIPT_BASE64: ${{ steps.deployment-files.outputs.script }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ needs.publish-image.outputs.ecr-registry }}
        run: |
          PARAMETERS=$(jq --null-input \
            --arg compose "$COMPOSE_BASE64" \
            --arg script "$SCRIPT_BASE64" \
            --arg imageTag "$IMAGE_TAG" \
            --arg registry "$ECR_REGISTRY" \
            '{
              commands: [
                "set -eu",
                "mkdir -p /opt/shipyard",
                ("printf %s " + ($compose | @sh) + " | base64 --decode > /opt/shipyard/compose.yaml"),
                ("printf %s " + ($script | @sh) + " | base64 --decode > /opt/shipyard/deploy.sh"),
                "chmod +x /opt/shipyard/deploy.sh",
                ("bash /opt/shipyard/deploy.sh " + ($imageTag | @sh) + " " + ($registry | @sh))
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Project,Values=Shipyard" \
            --parameters "$PARAMETERS" \
            --comment "Deploy Shipyard $IMAGE_TAG" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        run: |
          for ATTEMPT in {1..60}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm list-command-invocations \
                  --command-id "$COMMAND_ID" \
                  --details \
                  --query "CommandInvocations[0].CommandPlugins[*].Output" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm list-command-invocations \
                  --command-id "$COMMAND_ID" \
                  --details
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment"
          exit 1
