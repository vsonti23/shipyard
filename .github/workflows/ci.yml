name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test

  publish-image:
    name: Build and publish image
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vsonti23/shipyard:${{ github.sha }}
            ghcr.io/vsonti23/shipyard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-infra:
    name: Deploy Infra
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ALLOWED_HTTP_CIDR: ${{ secrets.ALLOWED_HTTP_CIDR }}

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infra deps
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify deployment configuration
        run: |
          if [[ -z "$ALLOWED_HTTP_CIDR" ]]; then
            echo "ALLOWED_HTTP_CIDR is unavailable"
            exit 1
          fi

          echo "ALLOWED_HTTP_CIDR is available"

      - name: Synthesize Shipyard stack
        run: npx cdk synth ShipyardStack

      - name: Deploy Shipyard stack
        run: npx cdk deploy ShipyardStack --require-approval never

  deploy-app:
    name: Deploy Application
    needs: deploy-infra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Encode deployment files
        id: deployment-files
        run: |
          echo "compose=$(base64 --wrap=0 deploy/compose.yaml)" >> "$GITHUB_OUTPUT"
          echo "script=$(base64 --wrap=0 deploy/deploy.sh)" >> "$GITHUB_OUTPUT"

      - name: Send deployment command
        id: send-command
        env:
          COMPOSE_BASE64: ${{ steps.deployment-files.outputs.compose }}
          SCRIPT_BASE64: ${{ steps.deployment-files.outputs.script }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          PARAMETERS=$(jq --null-input \
            --arg compose "$COMPOSE_BASE64" \
            --arg script "$SCRIPT_BASE64" \
            --arg imageTag "$IMAGE_TAG" \
            '{
              commands: [
                "set -eu",
                "mkdir -p /opt/shipyard",
                ("printf %s " + ($compose | @sh) + " | base64 --decode > /opt/shipyard/compose.yaml"),
                ("printf %s " + ($script | @sh) + " | base64 --decode > /opt/shipyard/deploy.sh"),
                "chmod +x /opt/shipyard/deploy.sh",
                ("bash /opt/shipyard/deploy.sh " + ($imageTag | @sh))
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Project,Values=Shipyard" \
            --parameters "$PARAMETERS" \
            --comment "Deploy Shipyard $IMAGE_TAG" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
