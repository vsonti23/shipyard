name: App

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".nvmrc"
      - "deploy/**"
      - ".github/workflows/application.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".nvmrc"
      - "deploy/**"
      - ".github/workflows/application.yml"

concurrency:
  group: shipyard-application-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test

  publish-image:
    name: Build and publish image
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        run: |
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{vars.AWS_REGION}}.amazonaws.com"

          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" |
              docker login --username AWS --password-stdin "$REGISTRY"

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/shipyard:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/shipyard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      ecr-registry: ${{ steps.ecr-login.outputs.registry }}

  deploy-app:
    name: Deploy Application
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition shipyard \
            --query taskDefinition \
            > task-definition.json
      - name: Set image in task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: shipyard
          image: ${{ needs.publish-image.outputs.ecr-registry }}/shipyard:${{ github.sha }}

      - name: Deploy task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps. task-definition.outputs.task-definition }}
          cluster: shipyard
          service: shipyard
          wait-for-service-stability: true
