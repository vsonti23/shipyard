name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test

  publish-image:
    name: Build and publish image
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vsonti23/shipyard:${{ github.sha }}
            ghcr.io/vsonti23/shipyard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-infra:
    name: Deploy Infra
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infra deps
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Synthesize Shipyard stack
        run: npx cdk synth ShipyardStack

      - name: Deploy Shipyard stack
        run: npx cdk deploy ShipyardStack --require-approval never

  test-ssm-connection:
    name: Test SSM Connection
    needs: deploy-infra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send test command
        id: send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Project,Values=Shipyard" \
            --parameters 'commands=["docker compose version"]' \
            --comment "Verify Docker Compose from Github Actions" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for command
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        run: |
          for ATTEMPT in {1..30}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)
            
            echo "SSM command status: $STATUS"

            case "$STATUS" in 
              Success)
                aws ssm list-command-invocations \
                  --command-id "$COMMAND_ID" \
                  --details \
                  --query "CommandInvocations[0].CommandPlugins[0].Output" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm list-command-invocations \
                  --command-id "$COMMAND_ID" \
                  --details 
                exit 1
                ;;
            esac

            sleep 2
          done

          echo "Timed out waiting for SSM command"
          exit 1
